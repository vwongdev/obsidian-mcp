name: Publish images

on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    uses: VWongDev/kube/.github/workflows/publish-image.yaml@main
    with:
      images: |
        [
          { "image": "mcp", "context": "." },
          { "image": "sync", "context": "sync" }
        ]

  bump-image:
    needs: publish
    uses: VWongDev/apps/.github/workflows/bump-image.yaml@main
    with:
      app: ${{ github.event.repository.name }}
      commit-message: "chore(obsidian-mcp): Update images to latest commit"
    secrets: inherit
